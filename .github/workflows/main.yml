name: ClashForge

on:
  schedule:
    - cron: '0 7-22/5 * * *'
  workflow_dispatch:

# 使用仓库内置的 GITHUB_TOKEN 提交，不再依赖手动维护的 secrets.BOT
# （PAT 过期/被撤销会让 checkout 直接失败，见 2026-02-19 起的所有运行记录）
permissions:
  contents: write

# 同一时间只跑一个实例，避免手动触发与定时任务并发推送冲突
concurrency:
  group: clashforge-generate
  cancel-in-progress: false

jobs:
  run_demo_actions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 脚本内部的阶段预算（秒）：到点会带着已有结果继续走完并保存，不会被 runner 直接 kill
      CLASHFORGE_FETCH_BUDGET: '1500'
      CLASHFORGE_TEST_BUDGET: '900'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install requirements.txt
        run: |
          pip install -r ./requirements.txt

      - name: Run ClashForge.py
        run: python ClashForge.py
        env:
          # 提高 api.github.com 的调用配额（匿名 60 次/小时，共享 runner IP 很容易 403）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash_config.yaml
          if [ -f clash_config_featured.yaml ]; then
            git add clash_config_featured.yaml
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "update"
          git pull --rebase --autostash
          git push
